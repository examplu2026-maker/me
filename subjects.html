<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>Subject Registration | School Portal</title>
  <style>
    /* EXAMPLUS THEME
       navy base  #0a1f33 → #12324d → #2a4d6b
       card dark  #06101c   inner #0b1a2b   border #1c2f44 / #26405a
       gold       #f2b705   (pressed #d9a304)   text on gold #0a1420
       text       #ffffff   muted #9fb3c8
       alert red  #e5222e
    */
    :root {
      --navy-1:#0a1f33; --navy-2:#12324d; --navy-3:#2a4d6b;
      --card:#06101c; --card-2:#0b1a2b; --line:#1c2f44; --line-2:#26405a;
      --gold:#f2b705; --gold-dark:#d9a304; --on-gold:#0a1420;
      --text:#ffffff; --muted:#9fb3c8; --red:#e5222e;
    }
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { width:100%; min-height:100vh; background:var(--navy-1); }
    body { font-family:'Segoe UI', Roboto, 'Helvetica Neue', system-ui, -apple-system, Arial, sans-serif;
           background:linear-gradient(180deg, var(--navy-1) 0%, var(--navy-2) 55%, var(--navy-3) 100%);
           background-attachment:fixed; color:var(--text);
           min-height:100vh; padding:16px; display:flex;
           justify-content:center; align-items:center; }

    /* LOGIN */
    .login-container { display:flex; justify-content:center; align-items:center;
      width:100%; min-height:85vh; padding:12px; }
    .login-box { background:var(--card); padding:32px 24px 44px; border-radius:48px;
      width:100%; max-width:480px; text-align:center;
      box-shadow:0 20px 35px rgba(0,0,0,0.5); border:1px solid var(--line-2); }
    .login-box h2 { color:var(--text); margin-bottom:28px; font-weight:800;
      font-size:1.8rem; letter-spacing:-0.5px; }
    .login-box input { width:100%; padding:16px 20px; margin:14px 0;
      border:2px solid var(--line-2); border-radius:60px; font-size:1rem; font-weight:500;
      background:var(--card-2); transition:all 0.2s ease; font-family:inherit;
      outline:none; color:var(--text); }
    .login-box input:focus { border-color:var(--gold); box-shadow:0 0 0 4px rgba(242,183,5,0.18); }
    .login-box input::placeholder { color:#6f879e; font-weight:450; font-size:0.9rem; }
    .login-box button { width:100%; padding:16px 20px; margin-top:20px;
      background:var(--gold); color:var(--on-gold); border:none; border-radius:60px;
      font-size:1rem; font-weight:800; letter-spacing:0.5px; cursor:pointer;
      transition:all 0.25s ease; box-shadow:0 4px 12px rgba(242,183,5,0.25);
      touch-action:manipulation; }
    .login-box button:active { transform:scale(0.97); background:var(--gold-dark); }
    .error { margin-top:20px; font-weight:600; font-size:0.8rem;
      background:rgba(229,34,46,0.15); border:1px solid rgba(229,34,46,0.5);
      padding:10px 18px; border-radius:60px;
      color:#ff8a92; display:inline-block; width:100%; }
    .info { margin-top:24px; font-size:0.7rem; color:var(--muted);
      background:var(--card-2); border:1px solid var(--line); padding:10px 18px; border-radius:60px;
      display:inline-block; font-weight:600; width:100%; }

    /* FORM */
    .form-container { display:none; font-family:'Segoe UI', Arial, sans-serif;
      padding:24px 20px 32px; background:var(--card); border-radius:32px;
      box-shadow:0 12px 28px rgba(0,0,0,0.45); border:1px solid var(--line);
      max-width:1400px; width:100%; margin:0 auto; color:var(--text); }
    .header-info { margin-bottom:24px; position:relative; display:flex;
      flex-wrap:wrap; justify-content:space-between; align-items:center; gap:12px; }
    .header-info h2 { font-size:1.4rem; font-weight:800; color:var(--text);
      margin:0; flex:1; }
    .logout-btn { background:transparent; color:#ff6b75; border:1px solid rgba(229,34,46,0.6);
      padding:8px 20px; border-radius:40px; cursor:pointer; font-weight:700;
      font-size:0.8rem; transition:0.2s; touch-action:manipulation; }
    .logout-btn:active { transform:scale(0.96); background:rgba(229,34,46,0.18); }
    .school-badge { background:rgba(242,183,5,0.12); border:1px solid rgba(242,183,5,0.35);
      padding:8px 16px; border-radius:40px;
      font-size:0.75rem; font-weight:700; color:var(--gold); text-align:center;
      width:100%; margin-bottom:24px; }
    .form-group { margin-bottom:20px; }
    label { display:block; font-weight:700; margin-bottom:10px;
      color:var(--text); font-size:0.85rem; }
    .row-2cols { display:grid; grid-template-columns:1fr; gap:16px; margin-bottom:24px; }
    .row-2cols input { width:100%; padding:14px 18px; border:2px solid var(--line-2);
      border-radius:60px; font-size:0.9rem; font-family:inherit;
      transition:all 0.2s ease; background:var(--card-2); color:var(--text); }
    .row-2cols input::placeholder { color:#6f879e; }
    .row-2cols input:focus { outline:none; border-color:var(--gold);
      box-shadow:0 0 0 3px rgba(242,183,5,0.18); }
    .subjects-grid { display:grid; grid-template-columns:1fr; gap:16px;
      margin-top:20px; margin-bottom:20px; }
    .subject-card { background:var(--card-2); border-radius:24px;
      padding:14px 16px; border:1px solid var(--line-2); transition:all 0.2s ease; }
    .subject-card label { font-size:0.8rem; margin-bottom:8px; color:var(--gold);
      display:block; }
    .subject-card input { width:100%; padding:12px 16px; border:2px solid var(--line-2);
      border-radius:40px; font-size:0.85rem; font-family:inherit;
      transition:all 0.2s ease; background:var(--card); color:var(--text); }
    .subject-card input::placeholder { color:#6f879e; }
    .subject-card input:focus { outline:none; border-color:var(--gold);
      box-shadow:0 0 0 3px rgba(242,183,5,0.18); }
    .submit-btn { margin-top:24px; padding:16px 24px; background:var(--gold);
      color:var(--on-gold); border:none; border-radius:60px; font-size:1rem;
      font-weight:800; cursor:pointer; transition:all 0.2s ease;
      width:100%; touch-action:manipulation; box-shadow:0 4px 12px rgba(242,183,5,0.25); }
    .submit-btn:active { transform:scale(0.97); background:var(--gold-dark); }
    .submit-btn:disabled { background:var(--line-2); color:var(--muted); box-shadow:none; cursor:not-allowed; transform:none; }
    .success-message { background:rgba(46,204,113,0.15); color:#6ee7a0;
      border:1px solid rgba(46,204,113,0.4); padding:14px 20px; margin:16px 0;
      border-radius:60px; text-align:center; font-weight:700;
      font-size:0.85rem; display:none; }
    .success-message.error { background:rgba(229,34,46,0.15); color:#ff8a92;
      border-color:rgba(229,34,46,0.5); }
    .loading { display:none; text-align:center; margin-top:20px; }
    .loading.active { display:block; }
    .spinner { border:3px solid rgba(255,255,255,0.15); border-top:3px solid var(--gold);
      border-radius:50%; width:40px; height:40px; animation:spin 0.8s linear infinite;
      margin:0 auto; }
    @keyframes spin { 0% { transform:rotate(0deg); } 100% { transform:rotate(360deg); } }
    .loading p { margin-top:10px; font-size:0.8rem; color:var(--muted); }
    @media (min-width:640px) {
      body { padding:20px; }
      .subjects-grid { grid-template-columns:repeat(2, 1fr); gap:18px; }
      .row-2cols { grid-template-columns:1fr 1fr; gap:20px; }
      .header-info h2 { font-size:1.6rem; }
    }
    @media (min-width:1024px) {
      body { padding:30px; }
      .form-container { padding:36px 40px 48px; }
      .subjects-grid { grid-template-columns:repeat(3, 1fr); gap:20px; }
      .header-info h2 { font-size:1.8rem; }
      .login-box { max-width:520px; padding:40px 36px 52px; }
      .login-box h2 { font-size:2.2rem; }
      .login-box input { padding:18px 24px; font-size:1rem; }
      .login-box button { padding:18px 24px; font-size:1.1rem; }
    }
    @media (min-width:1400px) {
      .subjects-grid { grid-template-columns:repeat(4, 1fr); }
      .form-container { max-width:1600px; }
    }
    button, .logout-btn, .submit-btn { touch-action:manipulation; cursor:pointer; }
    @media (hover:none) and (pointer:coarse) {
      .login-box button:hover, .submit-btn:hover, .logout-btn:hover { transform:none; }
    }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="loginSection" class="login-container">
  <div class="login-box">
    <h2>📚 SUBJECT REGISTRATION</h2>
    <input type="email" id="email" placeholder="Email address" autocomplete="off" inputmode="email">
    <input type="password" id="password" placeholder="Password" autocomplete="current-password">
    <button onclick="doLogin()">→ LOGIN →</button>
    <div id="error" class="error"></div>
    <div class="info">🔐 Sign in with your school email and password</div>
  </div>
</div>

<!-- FORM -->
<div id="formSection" class="form-container">
  <div class="header-info">
    <h2>🏫 Subject & Resumption Management</h2>
    <button class="logout-btn" onclick="doLogout()">Logout</button>
  </div>
  <div id="schoolBadge" class="school-badge"></div>

  <div id="successMessage" class="success-message"></div>

  <div class="row-2cols">
    <div class="form-group">
      <label>📅 Resumption Date</label>
      <input type="text" id="resumptionDate" placeholder="e.g., Monday, September 2nd, 2024">
    </div>
    <div></div>
  </div>

  <div class="subjects-grid" id="subjectsGrid"></div>

  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p>Saving subjects...</p>
  </div>

  <button class="submit-btn" id="submitBtn" onclick="submitData()">💾 Save All Subjects & Resumption Date</button>
</div>

<script>
  // ⚠️ REPLACE with your Web App URL
  const API_BASE_URL = 'https://script.google.com/macros/s/AKfycbxNt1oCTKkSa8h7oFc1AFqvyjGHn18nu1nWhvT6iADrRzPssK8zDHcgpk8oIl3l6BL53g/exec';

  let sessionToken = null;
  let currentSlug = null;
  let currentYear = null;
  const TOTAL_SUBJECTS = 20;

  function apiCallWithCallback(action, data, callback) {
    const callbackName = 'jsonpCallback_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
    let url = API_BASE_URL + '?action=' + encodeURIComponent(action);
    for (let key in data) {
      if (data.hasOwnProperty(key) && data[key] !== null && data[key] !== undefined) {
        url += '&' + encodeURIComponent(key) + '=' + encodeURIComponent(JSON.stringify(data[key]));
      }
    }
    url += '&callback=' + callbackName;

    const script = document.createElement('script');
    script.src = url;

    window[callbackName] = function(response) {
      delete window[callbackName];
      if (script.parentNode) script.remove();
      callback(response);
    };
    script.onerror = function() {
      delete window[callbackName];
      if (script.parentNode) script.remove();
      callback({ success: false, error: 'Network error or invalid response' });
    };
    const timeoutId = setTimeout(() => {
      if (window[callbackName]) {
        delete window[callbackName];
        if (script.parentNode) script.remove();
        callback({ success: false, error: 'Request timeout' });
      }
    }, 30000);
    const originalCallback = window[callbackName];
    window[callbackName] = function(response) {
      clearTimeout(timeoutId);
      originalCallback(response);
    };
    document.body.appendChild(script);
  }

  function showMessage(message, isError = false) {
    const successDiv = document.getElementById("successMessage");
    successDiv.innerHTML = message;
    successDiv.style.display = "block";
    successDiv.className = isError ? "success-message error" : "success-message";
    setTimeout(function() { successDiv.style.display = "none"; }, 5000);
  }

  function escapeHtml(t) {
    if(!t) return '';
    return String(t).replace(/[&<>]/g, function(m){
      if(m==='&') return '&amp;';
      if(m==='<') return '&lt;';
      if(m==='>') return '&gt;';
      return m;
    });
  }

  function doLogin() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    if (!email || !password) {
      document.getElementById("error").innerText = "⚠️ Please enter email and password";
      return;
    }
    document.getElementById("error").innerText = "🔐 Authenticating...";

    apiCallWithCallback('loginUser', { email: email, password: password }, function(result) {
      if (result && result.success && result.token) {
        sessionToken = result.token;
        currentSlug  = result.slug;
        currentYear  = result.year;

        document.getElementById("loginSection").style.display = "none";
        document.getElementById("formSection").style.display = "block";
        document.getElementById("schoolBadge").innerHTML =
          "🏫 " + escapeHtml(currentSlug) + " — " + escapeHtml(currentYear) + " Session";

        createSubjectsGrid();
        loadData();
        document.getElementById("error").innerText = "";
      } else {
        document.getElementById("error").innerText = (result && result.error) || "Login failed";
      }
    });
  }

  function doLogout() {
    sessionToken = null;
    currentSlug = null;
    currentYear = null;
    document.getElementById("loginSection").style.display = "flex";
    document.getElementById("formSection").style.display = "none";
    document.getElementById("email").value = "";
    document.getElementById("password").value = "";
    document.getElementById("error").innerText = "";
    document.getElementById("successMessage").style.display = "none";
  }

  function createSubjectsGrid() {
    const grid = document.getElementById("subjectsGrid");
    grid.innerHTML = '';
    for (let i = 1; i <= TOTAL_SUBJECTS; i++) {
      const card = document.createElement("div");
      card.className = "subject-card";
      card.innerHTML = `
        <label>📖 Subject ${i}</label>
        <input type="text" id="subject${i}" placeholder="Enter subject name" autocomplete="off">
      `;
      grid.appendChild(card);
    }
  }

  function loadData() {
    apiCallWithCallback('fetchSheetData', { token: sessionToken }, function(data) {
      if (data && !data.error) {
        const r = document.getElementById('resumptionDate');
        if (r) r.value = data.resumptionDate || '';
        for (let i = 1; i <= TOTAL_SUBJECTS; i++) {
          const f = document.getElementById('subject' + i);
          if (f && data['subject' + i]) f.value = data['subject' + i];
        }
        showMessage("✅ Data loaded successfully!", false);
      } else if (data && data.error) {
        showMessage("⚠️ Could not load existing data: " + data.error, true);
      }
    });
  }

  function submitData() {
    const submitBtn = document.getElementById("submitBtn");
    const loading = document.getElementById("loading");

    const resumptionDate = document.getElementById('resumptionDate').value.trim();
    if (!resumptionDate) {
      showMessage("⚠️ Please enter the resumption date", true);
      return;
    }

    submitBtn.disabled = true;
    loading.classList.add("active");

    const formData = { resumptionDate: resumptionDate };
    for (let i = 1; i <= TOTAL_SUBJECTS; i++) {
      const f = document.getElementById('subject' + i);
      if (f) formData['subject' + i] = f.value;
    }

    apiCallWithCallback('submitSheetData', { token: sessionToken, formData: formData }, function(response) {
      submitBtn.disabled = false;
      loading.classList.remove("active");
      if (response && response.success) {
        showMessage(response.message || "✅ Data saved successfully!", false);
      } else {
        showMessage("❌ Error saving data: " + ((response && response.error) || "Unknown error"), true);
      }
    });
  }
</script>
</body>
</html>
