<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ExamPlus Student Results</title>

<style>
/* EXAMPLUS THEME
   navy base  #0a1f33 → #12324d → #2a4d6b
   card dark  #06101c   inner #0b1a2b   border #1c2f44 / #26405a
   gold       #f2b705   (pressed #d9a304)   text on gold #0a1420
   text       #ffffff   muted #9fb3c8
   alert red  #e5222e
*/
:root {
  --navy-1:#0a1f33; --navy-2:#12324d; --navy-3:#2a4d6b;
  --card:#06101c; --card-2:#0b1a2b; --line:#1c2f44; --line-2:#26405a;
  --gold:#f2b705; --gold-dark:#d9a304; --on-gold:#0a1420;
  --text:#ffffff; --muted:#9fb3c8; --red:#e5222e;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  font-family: Arial, Helvetica, sans-serif;
  background: var(--navy-1);
  color: var(--text);
}

body {
  min-height: 100vh;
  background: linear-gradient(180deg, var(--navy-1) 0%, var(--navy-2) 55%, var(--navy-3) 100%);
  background-attachment: fixed;
}

/* =========================================================
   LOGIN
   ========================================================= */

.login-page {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  background:
    linear-gradient(
      180deg,
      var(--navy-1) 0%,
      var(--navy-2) 55%,
      var(--navy-3) 100%
    );
}

.login-box {
  width: 100%;
  max-width: 420px;
  background: var(--card);
  border: 1px solid var(--line-2);
  border-radius: 20px;
  padding: 32px 25px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}

.logo-area {
  text-align: center;
  margin-bottom: 25px;
}

.logo {
  width: 70px;
  height: 70px;
  margin: auto;
  border-radius: 18px;
  background: var(--gold);
  color: var(--on-gold);
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 30px;
  font-weight: 800;
}

.logo-area h1 {
  margin: 14px 0 5px;
  font-size: 25px;
  color: var(--text);
}

.logo-area p {
  margin: 0;
  color: var(--muted);
  font-size: 14px;
}

.input-group {
  margin-bottom: 17px;
}

.input-group label {
  display: block;
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 7px;
  color: var(--text);
}

.input-wrapper {
  position: relative;
}

.input-wrapper input {
  width: 100%;
  height: 50px;
  border: 2px solid var(--line-2);
  border-radius: 10px;
  padding: 0 14px;
  font-size: 16px;
  outline: none;
  background: var(--card-2);
  color: var(--text);
  transition: border-color .2s, box-shadow .2s;
}

.input-wrapper input::placeholder {
  color: #6f879e;
}

.input-wrapper input:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(242,183,5,.18);
}

.login-button {
  width: 100%;
  height: 52px;
  border: 0;
  border-radius: 10px;
  background: var(--gold);
  color: var(--on-gold);
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
  transition: .2s;
}

.login-button:hover {
  background: var(--gold-dark);
}

.login-button:disabled {
  opacity: .65;
  cursor: not-allowed;
}

.login-message {
  min-height: 22px;
  margin-top: 14px;
  text-align: center;
  font-size: 14px;
  font-weight: 600;
}

.error {
  color: #ff8a92;
}

.success {
  color: #6ee7a0;
}

/* =========================================================
   APP
   ========================================================= */

.app {
  display: none;
  min-height: 100vh;
}

.topbar {
  background: var(--card);
  color: var(--text);
  padding: 14px 18px;
  position: sticky;
  top: 0;
  z-index: 20;
  border-bottom: 2px solid var(--gold);
  box-shadow: 0 2px 10px rgba(0,0,0,.35);
}

.topbar-inner {
  max-width: 1300px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}

.brand {
  min-width: 0;
}

.brand-title {
  font-size: 20px;
  font-weight: 800;
}

.brand-subtitle {
  font-size: 12px;
  color: var(--muted);
  margin-top: 3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.logout-button {
  border: 1px solid rgba(229,34,46,.6);
  background: transparent;
  color: #ff6b75;
  border-radius: 8px;
  padding: 9px 14px;
  cursor: pointer;
  font-weight: 700;
}

.logout-button:hover {
  background: rgba(229,34,46,.18);
}

/* =========================================================
   CONTROLS
   ========================================================= */

.container {
  width: 100%;
  max-width: 1300px;
  margin: auto;
  padding: 20px;
}

.school-card {
  background: var(--card);
  border: 1px solid var(--line-2);
  border-radius: 14px;
  padding: 18px;
  box-shadow: 0 3px 15px rgba(0,0,0,.35);
  margin-bottom: 18px;
}

.school-card h2 {
  margin: 0;
  font-size: 22px;
  color: var(--text);
}

.session {
  margin-top: 6px;
  color: var(--gold);
  font-size: 14px;
  font-weight: 600;
}

.controls {
  display: grid;
  grid-template-columns:
    minmax(150px, 1fr)
    minmax(150px, 1fr)
    minmax(180px, 1.5fr)
    auto
    auto;
  gap: 12px;
  margin-bottom: 18px;
}

.control {
  background: var(--card);
  border: 1px solid var(--line-2);
  border-radius: 11px;
  padding: 10px;
  box-shadow: 0 3px 15px rgba(0,0,0,.25);
}

.control label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  color: var(--gold);
  margin-bottom: 5px;
}

.control select,
.control input {
  width: 100%;
  height: 40px;
  border: 2px solid var(--line-2);
  border-radius: 8px;
  padding: 0 10px;
  background: var(--card-2);
  font-size: 14px;
  color: var(--text);
  outline: none;
}

.control select option {
  background: var(--card-2);
  color: var(--text);
}

.control input::placeholder {
  color: #6f879e;
}

.control select:focus,
.control input:focus {
  border-color: var(--gold);
}

.action-button {
  align-self: end;
  height: 40px;
  border: 0;
  border-radius: 8px;
  padding: 0 15px;
  cursor: pointer;
  background: var(--gold);
  color: var(--on-gold);
  font-weight: 800;
}

.action-button:active {
  background: var(--gold-dark);
}

.action-button.secondary {
  background: transparent;
  color: var(--gold);
  border: 2px solid var(--gold);
}

/* =========================================================
   STATUS
   ========================================================= */

.status {
  padding: 13px 15px;
  background: var(--card);
  border: 1px solid var(--line-2);
  border-radius: 10px;
  margin-bottom: 16px;
  color: var(--muted);
  font-size: 14px;
  box-shadow: 0 3px 12px rgba(0,0,0,.25);
}

.status.error {
  color: #ff8a92;
  background: rgba(229,34,46,.15);
  border-color: rgba(229,34,46,.5);
}

.status.success {
  color: #6ee7a0;
  background: rgba(46,204,113,.12);
  border-color: rgba(46,204,113,.4);
}

/* =========================================================
   RESULTS
   ========================================================= */

.results-card {
  background: var(--card);
  border: 1px solid var(--line-2);
  border-radius: 14px;
  box-shadow: 0 3px 15px rgba(0,0,0,.35);
  overflow: hidden;
}

.results-header {
  padding: 16px;
  border-bottom: 1px solid var(--line-2);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}

.results-header h3 {
  margin: 0;
  font-size: 18px;
  color: var(--text);
}

.student-count {
  font-size: 13px;
  color: var(--gold);
  font-weight: 700;
}

.table-wrap {
  width: 100%;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

.results-table {
  width: 100%;
  min-width: 950px;
  border-collapse: collapse;
  color: var(--text);
}

.results-table th,
.results-table td {
  border: 1px solid var(--line-2);
  padding: 9px 10px;
  text-align: center;
  font-size: 13px;
}

.results-table thead th {
  background: var(--card-2);
  color: var(--gold);
  font-weight: 800;
}

.results-table .student-info {
  text-align: left;
  background: var(--card-2);
  color: var(--text);
  font-weight: 700;
  min-width: 120px;
}

.results-table .subject-name {
  background: rgba(242,183,5,.15);
  color: var(--gold);
}

.results-table .sub-head {
  background: var(--card-2);
  color: var(--muted);
  font-size: 11px;
}

.results-table tbody tr:hover {
  background: var(--card-2);
}

.no-results {
  padding: 40px 20px;
  text-align: center;
  color: var(--muted);
}

/* =========================================================
   LOADING
   ========================================================= */

.loading {
  display: none;
  text-align: center;
  padding: 30px;
  color: var(--muted);
}

.spinner {
  width: 35px;
  height: 35px;
  margin: auto auto 12px;
  border: 4px solid rgba(255,255,255,.15);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 900px) {

  .controls {
    grid-template-columns: 1fr 1fr;
  }

  .action-button {
    width: 100%;
  }
}

@media (max-width: 600px) {

  .container {
    padding: 12px;
  }

  .topbar {
    padding: 12px;
  }

  .topbar-inner {
    align-items: flex-start;
  }

  .brand-title {
    font-size: 17px;
  }

  .brand-subtitle {
    max-width: 210px;
  }

  .controls {
    grid-template-columns: 1fr;
  }

  .school-card h2 {
    font-size: 19px;
  }

  .login-box {
    padding: 27px 20px;
  }
}
</style>
</head>

<body>

<!-- =======================================================
     LOGIN PAGE
     ======================================================= -->

<div id="loginPage" class="login-page">

  <div class="login-box">

    <div class="logo-area">

      <div class="logo">
        EP
      </div>

      <h1>ExamPlus</h1>

      <p>Student Result Portal</p>

    </div>

    <form id="loginForm" autocomplete="off">

      <div class="input-group">

        <label for="username">
          Username / Email
        </label>

        <div class="input-wrapper">

          <input
            type="text"
            id="username"
            name="username"
            autocomplete="username"
            autocapitalize="none"
            spellcheck="false"
            placeholder="Enter username or email"
            required
          >

        </div>

      </div>

      <div class="input-group">

        <label for="password">
          Password
        </label>

        <div class="input-wrapper">

          <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            placeholder="Enter password"
            required
          >

        </div>

      </div>

      <button
        type="submit"
        class="login-button"
        id="loginButton"
      >
        Login
      </button>

      <div
        id="loginMessage"
        class="login-message"
      ></div>

    </form>

  </div>

</div>


<!-- =======================================================
     APPLICATION
     ======================================================= -->

<div id="app" class="app">

  <div class="topbar">

    <div class="topbar-inner">

      <div class="brand">

        <div
          id="topSchoolName"
          class="brand-title"
        >
          ExamPlus
        </div>

        <div
          id="topSession"
          class="brand-subtitle"
        >
          Student Result Portal
        </div>

      </div>

      <button
        type="button"
        id="logoutButton"
        class="logout-button"
      >
        Logout
      </button>

    </div>

  </div>


  <main class="container">

    <div class="school-card">

      <h2 id="schoolName">
        School
      </h2>

      <div
        id="sessionText"
        class="session"
      >
        Academic Session
      </div>

    </div>


    <!-- CONTROLS -->

    <div class="controls">

      <div class="control">

        <label for="termSelect">
          Term
        </label>

        <select id="termSelect">
          <option value="First Term">
            First Term
          </option>

          <option value="Second Term">
            Second Term
          </option>

          <option value="Third Term">
            Third Term
          </option>
        </select>

      </div>


      <div class="control">

        <label for="classSelect">
          Class
        </label>

        <select id="classSelect">

          <option value="">
            All Classes
          </option>

        </select>

      </div>


      <div class="control">

        <label for="searchInput">
          Search Student
        </label>

        <input
          type="search"
          id="searchInput"
          placeholder="Name or admission number"
          autocomplete="off"
        >

      </div>


      <button
        type="button"
        id="refreshButton"
        class="action-button"
      >
        Refresh
      </button>


      <button
        type="button"
        id="resetButton"
        class="action-button secondary"
      >
        Reset
      </button>

    </div>


    <div
      id="status"
      class="status"
    >
      Loading results...
    </div>


    <div
      id="loading"
      class="loading"
    >

      <div class="spinner"></div>

      Loading student results...

    </div>


    <!-- RESULTS -->

    <div class="results-card">

      <div class="results-header">

        <h3>
          Student Results
        </h3>

        <div
          id="studentCount"
          class="student-count"
        >
          0 students
        </div>

      </div>

      <div class="table-wrap">

        <table
          id="resultsTable"
          class="results-table"
        >

          <thead id="resultsHead"></thead>

          <tbody id="resultsBody"></tbody>

        </table>

        <div
          id="noResults"
          class="no-results"
          style="display:none;"
        >
          No student results found.
        </div>

      </div>

    </div>

  </main>

</div>


<script>

/* =========================================================
   EXAMPLUS API
   ========================================================= */

const API_URL =
  "https://script.google.com/macros/s/AKfycbzc74TgXR7GMnK7aut-kHESEOPDidBVETNQSfs05-j96um-eG-u0whLWT3XQOWA_OZRaw/exec";


/* =========================================================
   STATE
   ========================================================= */

let sessionToken = "";

let schoolInfo = {
  schoolName: "",
  schoolSlug: "",
  termName: "",
  termSession: "",
  academicYear: "",
  resultTab: ""
};

let allStudents = [];


/* =========================================================
   ELEMENTS
   ========================================================= */

const loginPage =
  document.getElementById("loginPage");

const app =
  document.getElementById("app");

const loginForm =
  document.getElementById("loginForm");

const usernameInput =
  document.getElementById("username");

const passwordInput =
  document.getElementById("password");

const loginButton =
  document.getElementById("loginButton");

const loginMessage =
  document.getElementById("loginMessage");

const schoolName =
  document.getElementById("schoolName");

const sessionText =
  document.getElementById("sessionText");

const topSchoolName =
  document.getElementById("topSchoolName");

const topSession =
  document.getElementById("topSession");

const termSelect =
  document.getElementById("termSelect");

const classSelect =
  document.getElementById("classSelect");

const searchInput =
  document.getElementById("searchInput");

const refreshButton =
  document.getElementById("refreshButton");

const resetButton =
  document.getElementById("resetButton");

const logoutButton =
  document.getElementById("logoutButton");

const statusBox =
  document.getElementById("status");

const loading =
  document.getElementById("loading");

const resultsHead =
  document.getElementById("resultsHead");

const resultsBody =
  document.getElementById("resultsBody");

const noResults =
  document.getElementById("noResults");

const studentCount =
  document.getElementById("studentCount");


/* =========================================================
   LOGIN FORM
   ========================================================= */

loginForm.addEventListener(
  "submit",
  function(event) {

    event.preventDefault();

    /*
     * Read values only when the user presses Login.
     * Nothing here clears or changes the input fields
     * while the user is typing.
     */

    const username =
      usernameInput.value.trim();

    const password =
      passwordInput.value;

    if (!username || !password) {

      showLoginMessage(
        "Please enter your username/email and password.",
        true
      );

      return;
    }

    loginUser(
      username,
      password
    );
  }
);


/* =========================================================
   LOGIN
   ========================================================= */

function loginUser(
  username,
  password
) {

  setLoginLoading(true);

  showLoginMessage(
    "Signing in...",
    false
  );

  const params = new URLSearchParams();

  params.set(
    "action",
    "login"
  );

  params.set(
    "email",
    username
  );

  params.set(
    "username",
    username
  );

  params.set(
    "password",
    password
  );

  jsonp(
    API_URL +
    "?" +
    params.toString(),
    function(response) {

      setLoginLoading(false);

      if (
        !response ||
        response.success !== true
      ) {

        showLoginMessage(
          response &&
          response.message
            ? response.message
            : "Login failed.",
          true
        );

        return;
      }

      sessionToken =
        response.token || "";

      const user =
        response.user || {};

      schoolInfo.schoolName =
        user.schoolName || "";

      schoolInfo.schoolSlug =
        user.schoolSlug || "";

      schoolInfo.termName =
        user.termName || "";

      schoolInfo.termSession =
        user.termSession || "";

      schoolInfo.academicYear =
        user.academicYear || "";

      schoolInfo.resultTab =
        user.resultTab || "";

      /*
       * Set term from Users!I.
       */

      setTermFromUser();

      /*
       * Keep login username, but clear password
       * only after successful login.
       */

      passwordInput.value = "";

      showApplication();

      loadResults();
    }
  );
}


/* =========================================================
   SET TERM
   ========================================================= */

function setTermFromUser() {

  const term =
    normalize(
      schoolInfo.termName
    );

  if (
    term === "first term"
  ) {

    termSelect.value =
      "First Term";

  } else if (
    term === "second term"
  ) {

    termSelect.value =
      "Second Term";

  } else if (
    term === "third term"
  ) {

    termSelect.value =
      "Third Term";
  }
}


/* =========================================================
   LOAD RESULTS
   ========================================================= */

function loadResults() {

  if (!sessionToken) {

    showStatus(
      "Your login session is missing. Please login again.",
      true
    );

    return;
  }

  showLoading(true);

  showStatus(
    "Loading results...",
    false
  );

  const params =
    new URLSearchParams();

  params.set(
    "action",
    "getresults"
  );

  params.set(
    "token",
    sessionToken
  );

  jsonp(
    API_URL +
    "?" +
    params.toString(),
    function(response) {

      showLoading(false);

      if (
        !response ||
        response.success !== true
      ) {

        showStatus(
          response &&
          response.message
            ? response.message
            : "Unable to load results.",
          true
        );

        return;
      }

      /*
       * Store students received from backend.
       */

      allStudents =
        Array.isArray(
          response.students
        )
          ? response.students
          : [];

      /*
       * Update school/session information
       * from backend.
       */

      if (response.schoolName) {
        schoolInfo.schoolName =
          response.schoolName;
      }

      if (response.schoolSlug) {
        schoolInfo.schoolSlug =
          response.schoolSlug;
      }

      if (response.termName) {
        schoolInfo.termName =
          response.termName;
      }

      if (response.termSession) {
        schoolInfo.termSession =
          response.termSession;
      }

      if (response.academicYear) {
        schoolInfo.academicYear =
          response.academicYear;
      }

      if (response.resultTab) {
        schoolInfo.resultTab =
          response.resultTab;
      }

      updateSchoolDisplay();

      buildClassList();

      renderResults();

      showStatus(
        "Results loaded successfully.",
        false
      );
    }
  );
}


/* =========================================================
   SCHOOL DISPLAY
   ========================================================= */

function updateSchoolDisplay() {

  const name =
    schoolInfo.schoolName ||
    schoolInfo.schoolSlug ||
    "ExamPlus";

  const session =
    schoolInfo.termSession ||
    (
      schoolInfo.termName +
      " " +
      schoolInfo.academicYear
    ).trim();

  schoolName.textContent =
    name;

  sessionText.textContent =
    session || "Academic Session";

  topSchoolName.textContent =
    name;

  topSession.textContent =
    session || "Student Result Portal";
}


/* =========================================================
   CLASS LIST
   ========================================================= */

function buildClassList() {

  const current =
    classSelect.value;

  const map = {};

  allStudents.forEach(
    function(student) {

      const value =
        String(
          student.className || ""
        ).trim();

      if (value) {

        map[
          normalize(value)
        ] = value;
      }
    }
  );

  const classes =
    Object.keys(map)
      .map(function(key) {
        return map[key];
      })
      .sort(function(a, b) {

        return a.localeCompare(
          b,
          undefined,
          {
            numeric: true,
            sensitivity: "base"
          }
        );

      });

  classSelect.innerHTML =
    '<option value="">All Classes</option>';

  classes.forEach(
    function(className) {

      const option =
        document.createElement("option");

      option.value =
        className;

      option.textContent =
        className;

      classSelect.appendChild(
        option
      );
    }
  );

  if (
    current &&
    classes.some(
      function(value) {
        return normalize(value) ===
          normalize(current);
      }
    )
  ) {

    classSelect.value =
      current;
  }
}


/* =========================================================
   RENDER RESULTS
   ========================================================= */

function renderResults() {

  const selectedClass =
    normalize(
      classSelect.value
    );

  const search =
    normalize(
      searchInput.value
    );

  const filtered =
    allStudents.filter(
      function(student) {

        const classMatches =
          !selectedClass ||
          normalize(
            student.className
          ) === selectedClass;

        if (!classMatches) {
          return false;
        }

        if (!search) {
          return true;
        }

        const name =
          normalize(
            student.studentName
          );

        const adm =
          normalize(
            student.admNo
          );

        return (
          name.includes(search) ||
          adm.includes(search)
        );
      }
    );

  studentCount.textContent =
    filtered.length +
    (
      filtered.length === 1
        ? " student"
        : " students"
    );

  resultsHead.innerHTML = "";
  resultsBody.innerHTML = "";

  if (!filtered.length) {

    noResults.style.display =
      "block";

    return;
  }

  noResults.style.display =
    "none";

  /*
   * Find every subject available
   * in the result data.
   */

  const subjectMap = {};

  filtered.forEach(
    function(student) {

      (
        student.subjects || []
      ).forEach(
        function(subject) {

          const key =
            normalize(
              subject.name
            );

          if (
            key &&
            !subjectMap[key]
          ) {

            subjectMap[key] =
              subject.name;
          }
        }
      );
    }
  );

  const subjects =
    Object.keys(subjectMap)
      .map(function(key) {
        return subjectMap[key];
      });

  /*
   * HEADER ROW 1
   */

  const row1 =
    document.createElement("tr");

  addHeader(
    row1,
    "ADM NO.",
    1,
    2
  );

  addHeader(
    row1,
    "STUDENT NAME",
    1,
    2
  );

  addHeader(
    row1,
    "CLASS",
    1,
    2
  );

  subjects.forEach(
    function(subject) {

      addHeader(
        row1,
        subject,
        3,
        1,
        "subject-name"
      );
    }
  );

  resultsHead.appendChild(row1);


  /*
   * HEADER ROW 2
   */

  const row2 =
    document.createElement("tr");

  addHeader(
    row2,
    "",
    1,
    1,
    "sub-head"
  );

  addHeader(
    row2,
    "",
    1,
    1,
    "sub-head"
  );

  addHeader(
    row2,
    "",
    1,
    1,
    "sub-head"
  );

  subjects.forEach(
    function() {

      addHeader(
        row2,
        "Test 1",
        1,
        1,
        "sub-head"
      );

      addHeader(
        row2,
        "Test 2",
        1,
        1,
        "sub-head"
      );

      addHeader(
        row2,
        "Exam",
        1,
        1,
        "sub-head"
      );
    }
  );

  resultsHead.appendChild(row2);


  /*
   * STUDENT ROWS
   */

  filtered.forEach(
    function(student) {

      const tr =
        document.createElement("tr");

      addCell(
        tr,
        student.admNo,
        "student-info"
      );

      addCell(
        tr,
        student.studentName,
        "student-info"
      );

      addCell(
        tr,
        student.className,
        "student-info"
      );

      subjects.forEach(
        function(subjectName) {

          const subject =
            findSubject(
              student.subjects,
              subjectName
            );

          addCell(
            tr,
            subject
              ? subject.test1
              : ""
          );

          addCell(
            tr,
            subject
              ? subject.test2
              : ""
          );

          addCell(
            tr,
            subject
              ? subject.exam
              : ""
          );
        }
      );

      resultsBody.appendChild(tr);
    }
  );
}


/* =========================================================
   FIND SUBJECT
   ========================================================= */

function findSubject(
  subjects,
  subjectName
) {

  if (
    !Array.isArray(subjects)
  ) {
    return null;
  }

  const target =
    normalize(subjectName);

  for (
    let i = 0;
    i < subjects.length;
    i++
  ) {

    if (
      normalize(
        subjects[i].name
      ) === target
    ) {
      return subjects[i];
    }
  }

  return null;
}


/* =========================================================
   TABLE HELPERS
   ========================================================= */

function addHeader(
  row,
  text,
  colspan,
  rowspan,
  className
) {

  const th =
    document.createElement("th");

  th.textContent =
    text || "";

  if (colspan > 1) {
    th.colSpan =
      colspan;
  }

  if (rowspan > 1) {
    th.rowSpan =
      rowspan;
  }

  if (className) {
    th.className =
      className;
  }

  row.appendChild(th);
}


function addCell(
  row,
  text,
  className
) {

  const td =
    document.createElement("td");

  td.textContent =
    text == null
      ? ""
      : String(text);

  if (className) {
    td.className =
      className;
  }

  row.appendChild(td);
}


/* =========================================================
   FILTER EVENTS
   ========================================================= */

termSelect.addEventListener(
  "change",
  function() {

    /*
     * The backend session is based on Users!I.
     *
     * We do not send an arbitrary term to the backend,
     * because the logged-in user's configured term
     * determines the permitted result rows.
     */

    const allowedTerm =
      normalize(
        schoolInfo.termName
      );

    const selected =
      normalize(
        termSelect.value
      );

    if (
      allowedTerm &&
      allowedTerm !== selected
    ) {

      termSelect.value =
        schoolInfo.termName;

      showStatus(
        "The current term is " +
        schoolInfo.termName +
        " according to the Users tab.",
        true
      );

      return;
    }

    renderResults();
  }
);


classSelect.addEventListener(
  "change",
  function() {
    renderResults();
  }
);


searchInput.addEventListener(
  "input",
  function() {
    renderResults();
  }
);


/* =========================================================
   REFRESH
   ========================================================= */

refreshButton.addEventListener(
  "click",
  function() {

    loadResults();
  }
);


/* =========================================================
   RESET
   ========================================================= */

resetButton.addEventListener(
  "click",
  function() {

    searchInput.value = "";

    classSelect.value = "";

    setTermFromUser();

    renderResults();

    showStatus(
      "Filters have been reset.",
      false
    );
  }
);


/* =========================================================
   LOGOUT
   ========================================================= */

logoutButton.addEventListener(
  "click",
  function() {

    sessionToken = "";

    allStudents = [];

    schoolInfo = {
      schoolName: "",
      schoolSlug: "",
      termName: "",
      termSession: "",
      academicYear: "",
      resultTab: ""
    };

    usernameInput.value = "";
    passwordInput.value = "";

    resultsHead.innerHTML = "";
    resultsBody.innerHTML = "";

    app.style.display =
      "none";

    loginPage.style.display =
      "flex";

    showLoginMessage(
      "",
      false
    );

    usernameInput.focus();
  }
);


/* =========================================================
   SHOW APPLICATION
   ========================================================= */

function showApplication() {

  loginPage.style.display =
    "none";

  app.style.display =
    "block";

  updateSchoolDisplay();
}


/* =========================================================
   LOGIN MESSAGE
   ========================================================= */

function showLoginMessage(
  message,
  isError
) {

  loginMessage.textContent =
    message || "";

  loginMessage.className =
    "login-message " +
    (
      isError
        ? "error"
        : "success"
    );
}


/* =========================================================
   STATUS
   ========================================================= */

function showStatus(
  message,
  isError
) {

  statusBox.textContent =
    message || "";

  statusBox.className =
    "status " +
    (
      isError
        ? "error"
        : "success"
    );
}


/* =========================================================
   LOADING
   ========================================================= */

function showLoading(
  visible
) {

  loading.style.display =
    visible
      ? "block"
      : "none";
}


/* =========================================================
   LOGIN BUTTON STATE
   ========================================================= */

function setLoginLoading(
  loadingState
) {

  loginButton.disabled =
    loadingState;

  loginButton.textContent =
    loadingState
      ? "Signing in..."
      : "Login";
}


/* =========================================================
   NORMALIZE
   ========================================================= */

function normalize(
  value
) {

  return String(
    value == null
      ? ""
      : value
  )
    .trim()
    .toLowerCase()
    .replace(
      /\s+/g,
      " "
    );
}


/* =========================================================
   JSONP
   ========================================================= */

function jsonp(
  url,
  callback
) {

  const callbackName =
    "examplusCallback_" +
    Date.now() +
    "_" +
    Math.floor(
      Math.random() * 100000
    );

  const script =
    document.createElement("script");

  let finished = false;

  const cleanup =
    function() {

      if (finished) {
        return;
      }

      finished = true;

      try {
        delete window[
          callbackName
        ];
      } catch (error) {
        window[
          callbackName
        ] = undefined;
      }

      if (
        script &&
        script.parentNode
      ) {
        script.parentNode.removeChild(
          script
        );
      }
    };

  window[callbackName] =
    function(data) {

      cleanup();

      callback(data);
    };

  script.onerror =
    function() {

      cleanup();

      callback({
        success: false,
        message:
          "Unable to connect to the ExamPlus server."
      });
    };

  script.src =
    url +
    (
      url.indexOf("?") >= 0
        ? "&"
        : "?"
    ) +
    "callback=" +
    encodeURIComponent(
      callbackName
    );

  document.body.appendChild(
    script
  );
}
