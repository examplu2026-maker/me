<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School Fees Drive · Letter Generator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #e6e9ef;
    font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; padding: 20px;
  }
  .app-container {
    max-width: 860px; width: 100%;
    background: white; border-radius: 28px;
    box-shadow: 0 20px 40px rgba(0,20,40,0.2);
    padding: 30px 35px;
  }
  h1 {
    font-size: 1.8rem; font-weight: 600; color: #1e2b4f;
    margin-bottom: 8px; display: flex; align-items: center; gap: 8px;
  }
  h1 small {
    font-size: 0.9rem; font-weight: 400; color: #5f6c8c;
    margin-left: auto; background: #eff2f9;
    padding: 4px 12px; border-radius: 30px;
  }
  .form-grid {
    display: flex; flex-wrap: wrap; gap: 18px 20px;
    margin: 25px 0 20px; align-items: flex-end;
  }
  .input-group { flex: 1 1 180px; display: flex; flex-direction: column; gap: 6px; }
  .input-group label {
    font-size: 0.85rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.3px; color: #3d4b6b;
  }
  .input-group input {
    padding: 12px 16px; border: 2px solid #cfd9e8;
    border-radius: 16px; font-size: 1rem; font-weight: 500;
    background: #fbfdff; transition: 0.2s; outline: none; color: #0b1a33;
  }
  .input-group input:focus {
    border-color: #2f5b9c; box-shadow: 0 0 0 4px rgba(47,91,156,0.15);
  }
  .btn-row { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 30px; }
  .btn {
    padding: 14px 32px; border-radius: 40px; border: none;
    font-size: 1rem; font-weight: 700; letter-spacing: 0.3px;
    cursor: pointer; transition: 0.15s;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    background: white; color: #1e2b4f;
    box-shadow: 0 6px 12px rgba(0,0,0,0.04);
    border: 2px solid #d9e2f0;
  }
  .btn-primary {
    background: #1e3f70; color: white; border: 2px solid #1e3f70;
    box-shadow: 0 12px 18px -6px #1e3f7040;
  }
  .btn-primary:hover { background: #0f2a4f; }
  .btn-print { background: #f0f4fc; border-color: #b7c6e0; color: #1e3f70; }
  .btn-print:hover { background: #e2eaf8; }
  .btn:active { transform: scale(0.96); }

  .letter-preview {
    margin-top: 18px; display: flex; justify-content: center;
    background: #f4f7fd; padding: 20px 10px; border-radius: 24px;
  }
  .pos-letter {
    width: 80mm; background: white;
    box-shadow: 0 12px 30px rgba(0,0,0,0.15);
    padding: 8mm 5mm 10mm 5mm;
    font-family: 'Courier New', 'Segoe UI', monospace;
    border-radius: 4px; border: 1px solid #cdd7e6; color: #0f1a2b;
  }
  .pos-letter .school-header {
    text-align: center; margin-bottom: 6mm;
    border-bottom: 2px dashed #2c3e5c; padding-bottom: 3mm;
  }
  .pos-letter .school-logo {
    max-width: 22mm; max-height: 22mm; margin: 0 auto 2mm;
    display: block; object-fit: contain;
  }
  .pos-letter .school-name {
    font-size: 18pt; font-weight: 900; line-height: 1.2;
    letter-spacing: 0.5px; word-break: break-word;
    text-transform: uppercase; color: #0b1a2e;
  }
  .pos-letter .letter-body {
    font-size: 15pt; font-weight: 800; line-height: 1.6;
    letter-spacing: 0.3px; word-break: break-word;
    white-space: pre-wrap; margin: 4mm 0 6mm;
  }
  .pos-letter .letter-body p { margin-bottom: 4mm; }
  .pos-letter .date-line {
    font-size: 14pt; font-weight: 800; margin-bottom: 5mm;
    text-decoration: underline; text-underline-offset: 3px;
  }
  .pos-letter .salutation { font-size: 15pt; font-weight: 800; margin-bottom: 3mm; }
  .pos-letter .closing { margin-top: 6mm; font-size: 15pt; font-weight: 800; }
  .pos-letter .signature {
    margin-top: 10mm; border-top: 2px solid #1e2b4f;
    width: 60%; padding-top: 2mm; font-size: 13pt; font-weight: 800;
  }
  .status-msg { font-size: 0.9rem; margin-top: 8px; color: #1e6b3b; font-weight: 500; min-height: 24px; }
  .status-msg.error { color: #b12a2a; }
  .logo-placeholder {
    width: 22mm; height: 22mm; background: #d9e2f0; border-radius: 50%;
    margin: 0 auto 2mm; display: flex; align-items: center;
    justify-content: center; font-size: 8pt; font-weight: bold; color: #4a5a7a;
  }

  @media print {
    body { background: white; padding: 0; margin: 0; display: block; }
    .app-container { box-shadow: none; padding: 0; max-width: 100%; border-radius: 0; background: white; }
    .no-print { display: none !important; }
    .letter-preview { background: white; padding: 0; margin: 0; border-radius: 0; display: block; }
    .pos-letter {
      box-shadow: none; border: none; width: 80mm;
      margin: 0 auto; padding: 6mm 5mm;
      page-break-after: avoid; page-break-inside: avoid;
    }
    .pos-letter .school-name { font-size: 18pt; }
    .pos-letter .letter-body { font-size: 15pt; }
  }
</style>
</head>
<body>
<div class="app-container">
  <h1>✦ Fees Drive Letter <small>POS · 80mm</small></h1>

  <div class="no-print">
    <div class="form-grid">
      <div class="input-group">
        <label for="letterDate">Date</label>
        <input type="date" id="letterDate" value="2026-06-12">
      </div>
      <div class="input-group">
        <label for="letterDay">Day</label>
        <input type="text" id="letterDay" placeholder="e.g. Friday" value="Friday">
      </div>
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" id="saveBtn">💾 Save letter</button>
      <button class="btn btn-print" id="printBtn">🖨️ Print (POS)</button>
    </div>
    <div id="statusMsg" class="status-msg"></div>
  </div>

  <div class="letter-preview">
    <div class="pos-letter">
      <div class="school-header" id="schoolHeader">
        <div class="logo-placeholder" id="logoFallback">LOGO</div>
        <div class="school-name" id="schoolNameDisplay">SCHOOL NAME</div>
      </div>
      <div class="date-line" id="dateLine">Friday, 12th June 2026</div>
      <div class="salutation">Dear Parents,</div>
      <div class="letter-body" id="letterBody">
        <p>please be informed that there will be a school fees drive on <strong>Friday, 12th June 2026</strong>.</p>
        <p>Your cooperation is highly appreciated.</p>
        <p>Thank you.</p>
      </div>
      <div class="closing">
        Yours faithfully,<br>
        <span style="font-weight:900;">School Management</span>
      </div>
      <div class="signature">(Signature)</div>
    </div>
  </div>
</div>

<script>
/* =========================================================================
   ⬇️  STEP 3: PASTE YOUR DEPLOYED WEB APP URL BETWEEN THE QUOTES BELOW
   Example: 'https://script.google.com/macros/s/AKfycbx.../exec'
   ========================================================================= */
const API_URL = 'https://script.google.com/macros/s/AKfycbwpNLGcdjg6Zy3DZkExldH9EpgnPxxq3uYYI0gW3fn_BcpkfPfXEM72BtYEt_Oi-tHFmw/exec';

/* ---------- DOM references ---------- */
const dateInput         = document.getElementById('letterDate');
const dayInput          = document.getElementById('letterDay');
const dateLine          = document.getElementById('dateLine');
const letterBody        = document.getElementById('letterBody');
const schoolNameDisplay = document.getElementById('schoolNameDisplay');
const schoolHeader      = document.getElementById('schoolHeader');
const saveBtn           = document.getElementById('saveBtn');
const printBtn          = document.getElementById('printBtn');
const statusMsg         = document.getElementById('statusMsg');

/* ---------- Date helpers ---------- */
function formatDateOrdinal(dateStr) {
  if (!dateStr) return '12th June 2026';
  const d = new Date(dateStr + 'T12:00:00');
  if (isNaN(d)) return '12th June 2026';
  const day = d.getDate();
  const months = ['January','February','March','April','May','June',
                  'July','August','September','October','November','December'];
  const month = months[d.getMonth()];
  const year = d.getFullYear();
  const suffix = (day % 10 === 1 && day !== 11) ? 'st' :
                 (day % 10 === 2 && day !== 12) ? 'nd' :
                 (day % 10 === 3 && day !== 13) ? 'rd' : 'th';
  return `${day}${suffix} ${month} ${year}`;
}

function getWeekdayFromDate(dateStr) {
  if (!dateStr) return 'Friday';
  const d = new Date(dateStr + 'T12:00:00');
  if (isNaN(d)) return 'Friday';
  return ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d.getDay()];
}

/* ---------- Live preview ---------- */
function updateLetterContent() {
  const selectedDate = dateInput.value || '2026-06-12';
  const dateFormatted = formatDateOrdinal(selectedDate);
  let day = dayInput.value.trim();
  if (!day) {
    day = getWeekdayFromDate(selectedDate);
    dayInput.value = day;
  }
  dateLine.textContent = `${day}, ${dateFormatted}`;
  letterBody.innerHTML =
    `<p>please be informed that there will be a school fees drive on <strong>${day}, ${dateFormatted}</strong>.</p>` +
    `<p>Your cooperation is highly appreciated.</p>` +
    `<p>Thank you.</p>`;
}

/* ---------- Status ---------- */
function setStatus(text, isError) {
  statusMsg.textContent = text;
  statusMsg.className = 'status-msg' + (isError ? ' error' : '');
}

/* ---------- Logo fallback ---------- */
function addLogoFallback() {
  if (document.getElementById('logoFallback')) return;
  const fb = document.createElement('div');
  fb.id = 'logoFallback';
  fb.className = 'logo-placeholder';
  fb.textContent = 'LOGO';
  schoolHeader.prepend(fb);
}

function setFallbackSchoolData() {
  const oldLogo = document.querySelector('.school-logo');
  if (oldLogo) oldLogo.remove();
  addLogoFallback();
  schoolNameDisplay.textContent = 'SCHOOL NAME';
}

/* ---------- Fetch via JSONP (works despite CORS) ---------- */
function fetchSchoolData() {
  if (!API_URL || API_URL === 'PASTE_YOUR_WEB_APP_URL_HERE') {
    setFallbackSchoolData();
    setStatus('⚠️ Set API_URL inside the HTML file (Step 3).', true);
    return;
  }

  const callbackName = 'gsCallback_' + Date.now();

  window[callbackName] = function(data) {
    try {
      const logoUrl    = (data.logoUrl || '').trim();
      const schoolName = (data.schoolName || 'SCHOOL NAME').trim();

      schoolNameDisplay.textContent = schoolName;

      const oldLogo = document.querySelector('.school-logo');
      if (oldLogo) oldLogo.remove();
      const oldFallback = document.getElementById('logoFallback');
      if (oldFallback) oldFallback.remove();

      if (logoUrl) {
        const img = document.createElement('img');
        img.className = 'school-logo';
        img.alt = 'School Logo';
        img.src = logoUrl;
        img.onerror = function() { img.remove(); addLogoFallback(); };
        schoolHeader.prepend(img);
      } else {
        addLogoFallback();
      }

      setStatus('✅ School data loaded.', false);
    } catch (err) {
      console.error(err);
      setFallbackSchoolData();
      setStatus('⚠️ Error reading data.', true);
    } finally {
      delete window[callbackName];
      const s = document.getElementById(callbackName);
      if (s) s.remove();
    }
  };

  const script = document.createElement('script');
  script.id  = callbackName;
  script.src = API_URL + (API_URL.indexOf('?') >= 0 ? '&' : '?') + 'callback=' + callbackName;
  script.onerror = function() {
    setFallbackSchoolData();
    setStatus('❌ Could not reach Apps Script. Check API_URL.', true);
    delete window[callbackName];
  };
  document.body.appendChild(script);
}

/* ---------- Save ---------- */
function saveLetter() {
  const dateVal = dateInput.value || '2026-06-12';
  const dayVal  = dayInput.value.trim() || getWeekdayFromDate(dateVal);
  const dateFormatted = formatDateOrdinal(dateVal);
  const schoolName = schoolNameDisplay.textContent;

  const letterData = {
    action: 'save',
    date: dateVal, day: dayVal, dateFormatted: dateFormatted,
    schoolName: schoolName,
    message: 'Fees drive on ' + dayVal + ', ' + dateFormatted,
    timestamp: new Date().toISOString()
  };

  console.log('💾 Letter saved (local):', letterData);

  if (API_URL && API_URL !== 'PASTE_YOUR_WEB_APP_URL_HERE') {
    fetch(API_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(letterData)
    }).catch(function(err) { console.warn('Save to sheet failed:', err); });
  }

  setStatus('✅ Letter saved — ' + dayVal + ', ' + dateFormatted, false);
}

/* ---------- Print ---------- */
function printLetter() { window.print(); }

/* ---------- Init ---------- */
function init() {
  if (!dateInput.value) dateInput.value = '2026-06-12';
  dayInput.value = getWeekdayFromDate(dateInput.value);
  updateLetterContent();

  dateInput.addEventListener('change', function() {
    dayInput.value = getWeekdayFromDate(dateInput.value);
    updateLetterContent();
  });
  dayInput.addEventListener('input', updateLetterContent);

  saveBtn.addEventListener('click', saveLetter);
  printBtn.addEventListener('click', printLetter);

  fetchSchoolData();
}

window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
