<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School Fees Drive · POS Letter</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #e6e9ef;
    font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    display: flex; justify-content: center; align-items: flex-start;
    min-height: 100vh; padding: 20px;
  }
  .app-container {
    max-width: 1100px; width: 100%;
    background: white; border-radius: 28px;
    box-shadow: 0 20px 40px rgba(0,20,40,0.2);
    padding: 30px 35px;
  }
  h1 {
    font-size: 1.8rem; font-weight: 700; color: #000;
    margin-bottom: 8px; display: flex; align-items: center; gap: 8px;
  }
  h1 small {
    font-size: 0.9rem; font-weight: 400; color: #5f6c8c;
    margin-left: auto; background: #eff2f9;
    padding: 4px 12px; border-radius: 30px;
  }
  .form-grid {
    display: flex; flex-wrap: wrap; gap: 18px 20px;
    margin: 25px 0 20px; align-items: flex-end;
  }
  .input-group { flex: 1 1 180px; display: flex; flex-direction: column; gap: 6px; }
  .input-group label {
    font-size: 0.85rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.3px; color: #000;
  }
  .input-group input {
    padding: 12px 16px; border: 2px solid #cfd9e8;
    border-radius: 16px; font-size: 1rem; font-weight: 600;
    background: #fbfdff; transition: 0.2s; outline: none; color: #000;
  }
  .input-group input:focus {
    border-color: #2f5b9c; box-shadow: 0 0 0 4px rgba(47,91,156,0.15);
  }
  .btn-row { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 20px; }
  .btn {
    padding: 14px 32px; border-radius: 40px;
    font-size: 1rem; font-weight: 700; letter-spacing: 0.3px;
    cursor: pointer; transition: 0.15s;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    background: white; color: #000;
    box-shadow: 0 6px 12px rgba(0,0,0,0.04);
    border: 2px solid #d9e2f0;
  }
  .btn-primary { background: #1e3f70; color: white; border: 2px solid #1e3f70; }
  .btn-primary:hover { background: #0f2a4f; }
  .btn-print { background: #f0f4fc; border-color: #b7c6e0; color: #1e3f70; }
  .btn-print:hover { background: #e2eaf8; }
  .btn:active { transform: scale(0.96); }
  .status-msg { font-size: 0.9rem; margin-top: 8px; color: #1e6b3b; font-weight: 600; min-height: 24px; }
  .status-msg.error { color: #b12a2a; }

  /* ---------- PREVIEW AREA ---------- */
  .letter-preview {
    margin-top: 10px;
    display: flex;
    justify-content: center;
    background: #f4f7fd;
    padding: 20px;
    border-radius: 24px;
    overflow: auto;
  }

  /* ---------- POS LETTER (80mm wide continuous roll) ---------- */
  .pos-letter {
    width: 72mm;                /* 80mm paper minus 4mm each side */
    min-height: 180mm;          /* preview only — real print flows freely */
    background: white;
    box-shadow: 0 12px 30px rgba(0,0,0,0.15);
    border-radius: 4px;
    border: 1px dashed #b7c6e0;
    padding: 4mm 2mm;
    overflow: visible;

    font-family: 'Arial Black', 'Helvetica', 'Segoe UI', sans-serif;
    color: #000;
    font-weight: 900;
    letter-spacing: 0.2px;
    line-height: 1.15;
    text-align: center;
  }

  /* ---------- SCHOOL HEADER ---------- */
  .school-header {
    text-align: center;
    border-bottom: 2px dashed #000;
    padding-bottom: 3mm;
    margin-bottom: 4mm;
  }

  .school-logo {
    max-width: 22mm;
    max-height: 22mm;
    margin: 0 auto 2mm;
    object-fit: contain;
    display: block;
  }
  .logo-placeholder {
    width: 18mm; height: 18mm; background: #d9e2f0; border-radius: 50%;
    margin: 0 auto 2mm; display: flex; align-items: center;
    justify-content: center; font-size: 8pt; font-weight: 900; color: #000;
  }

  .school-name {
    font-size: 18pt;
    font-weight: 900;
    color: #000;
    text-transform: uppercase;
    line-height: 1.1;
    letter-spacing: 0.3px;
    word-break: break-word;
  }

  /* ---------- LETTER CONTENT ---------- */
  .salutation {
    font-size: 14pt;
    font-weight: 900;
    color: #000;
    text-align: left;
    margin: 3mm 0 2mm;
  }

  .letter-body {
    font-size: 14pt;
    font-weight: 900;
    line-height: 1.35;
    color: #000;
    text-align: left;
    margin: 3mm 0;
  }
  .letter-body p {
    margin: 0 0 3mm;
    word-break: break-word;
  }
  .letter-body strong { font-weight: 900; }

  .closing {
    font-size: 14pt;
    font-weight: 900;
    color: #000;
    text-align: left;
    margin: 4mm 0 2mm;
  }
  .signature {
    font-size: 12pt;
    font-weight: 900;
    color: #000;
    text-align: left;
    border-top: 2px solid #000;
    width: 50%;
    padding-top: 1mm;
    margin-top: 2mm;
  }

  /* ---------- PRINT: true POS thermal roll ---------- */
  @media print {
    /* POS roll = 80mm wide, height is continuous (auto) */
    @page {
      size: 80mm auto;
      margin: 0;
    }
    html, body {
      background: #fff !important;
      padding: 0 !important;
      margin: 0 !important;
      width: 80mm !important;
      height: auto !important;
      overflow: visible !important;
    }
    .app-container {
      box-shadow: none !important;
      padding: 0 !important;
      margin: 0 !important;
      max-width: none !important;
      width: 80mm !important;
      border-radius: 0 !important;
      background: #fff !important;
    }
    .no-print { display: none !important; }
    .letter-preview {
      background: #fff !important;
      padding: 0 !important;
      margin: 0 !important;
      border-radius: 0 !important;
      display: block !important;
      overflow: visible !important;
    }
    .pos-letter {
      box-shadow: none !important;
      border: none !important;
      border-radius: 0 !important;
      width: 80mm !important;
      min-height: 0 !important;
      padding: 3mm 3mm !important;
      page-break-after: avoid !important;
      page-break-inside: avoid !important;
      color: #000 !important;
      font-weight: 900 !important;
      overflow: visible !important;
    }
    .school-name  { font-size: 18pt !important; color: #000 !important; font-weight: 900 !important; }
    .salutation   { font-size: 14pt !important; color: #000 !important; font-weight: 900 !important; }
    .letter-body  { font-size: 14pt !important; color: #000 !important; font-weight: 900 !important; }
    .closing      { font-size: 14pt !important; color: #000 !important; font-weight: 900 !important; }
    .signature    { font-size: 12pt !important; color: #000 !important; font-weight: 900 !important; }
  }

  /* ---------- Smaller POS (58mm) — optional class ---------- */
  .pos-58 .pos-letter { width: 52mm; }
  @media print {
    .pos-58 @page { size: 58mm auto; margin: 0; }
    .pos-58 .pos-letter { width: 58mm !important; padding: 2mm !important; }
    .pos-58 .school-name { font-size: 14pt !important; }
    .pos-58 .salutation,
    .pos-58 .letter-body,
    .pos-58 .closing { font-size: 11pt !important; }
  }
</style>
</head>
<body>
<div class="app-container">
  <h1>✦ Fees Drive Letter <small>POS · 80mm roll</small></h1>

  <div class="no-print">
    <div class="form-grid">
      <div class="input-group">
        <label for="letterDate">Date</label>
        <input type="date" id="letterDate" value="2026-06-12">
      </div>
      <div class="input-group">
        <label for="letterDay">Day</label>
        <input type="text" id="letterDay" placeholder="e.g. Friday" value="FRIDAY">
      </div>
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" id="saveBtn">💾 Save letter</button>
      <button class="btn btn-print" id="printBtn">🖨️ Print (POS)</button>
    </div>
    <div id="statusMsg" class="status-msg"></div>
  </div>

  <!-- POS letter preview -->
  <div class="letter-preview">
    <div class="pos-letter">
      <div class="school-header" id="schoolHeader">
        <div class="logo-placeholder" id="logoFallback">LOGO</div>
        <div class="school-name" id="schoolNameDisplay">SCHOOL NAME</div>
      </div>

      <div class="salutation">DEAR PARENTS,</div>

      <div class="letter-body" id="letterBody">
        <p>PLEASE BE INFORMED THAT THERE WILL BE A SCHOOL FEES DRIVE ON <strong>FRIDAY, 12TH JUNE 2026</strong>.</p>
        <p>YOUR COOPERATION IS HIGHLY APPRECIATED.</p>
        <p>THANK YOU.</p>
      </div>

      <div class="closing">
        YOURS FAITHFULLY,
      </div>
      <div class="signature">SCHOOL MANAGEMENT</div>
    </div>
  </div>
</div>

<script>
/* =========================================================================
   ⬇️  PASTE YOUR DEPLOYED WEB APP URL BETWEEN THE QUOTES BELOW
   ========================================================================= */
const API_URL = 'https://script.google.com/macros/s/AKfycbz-mivjPHnonlwxnwmlLgab9YtHtGyEMPxkTbEH-g31x4wC30S-spqDhRPuM21H_WK0vg/exec';

const dateInput         = document.getElementById('letterDate');
const dayInput          = document.getElementById('letterDay');
const letterBody        = document.getElementById('letterBody');
const schoolNameDisplay = document.getElementById('schoolNameDisplay');
const schoolHeader      = document.getElementById('schoolHeader');
const saveBtn           = document.getElementById('saveBtn');
const printBtn          = document.getElementById('printBtn');
const statusMsg         = document.getElementById('statusMsg');

function formatDateOrdinal(dateStr) {
  if (!dateStr) return '12TH JUNE 2026';
  const d = new Date(dateStr + 'T12:00:00');
  if (isNaN(d)) return '12TH JUNE 2026';
  const day = d.getDate();
  const months = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE',
                  'JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
  const month = months[d.getMonth()];
  const year = d.getFullYear();
  const suffix = (day % 10 === 1 && day !== 11) ? 'ST' :
                 (day % 10 === 2 && day !== 12) ? 'ND' :
                 (day % 10 === 3 && day !== 13) ? 'RD' : 'TH';
  return `${day}${suffix} ${month} ${year}`;
}

function getWeekdayFromDate(dateStr) {
  if (!dateStr) return 'FRIDAY';
  const d = new Date(dateStr + 'T12:00:00');
  if (isNaN(d)) return 'FRIDAY';
  return ['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'][d.getDay()];
}

function updateLetterContent() {
  const selectedDate = dateInput.value || '2026-06-12';
  const dateFormatted = formatDateOrdinal(selectedDate);
  let day = (dayInput.value || '').trim().toUpperCase();
  if (!day) {
    day = getWeekdayFromDate(selectedDate);
  }
  dayInput.value = day;

  letterBody.innerHTML =
    `<p>PLEASE BE INFORMED THAT THERE WILL BE A SCHOOL FEES DRIVE ON <strong>${day}, ${dateFormatted}</strong>.</p>` +
    `<p>YOUR COOPERATION IS HIGHLY APPRECIATED.</p>` +
    `<p>THANK YOU.</p>`;
}

function setStatus(text, isError) {
  statusMsg.textContent = text;
  statusMsg.className = 'status-msg' + (isError ? ' error' : '');
}

function addLogoFallback() {
  if (document.getElementById('logoFallback')) return;
  const fb = document.createElement('div');
  fb.id = 'logoFallback';
  fb.className = 'logo-placeholder';
  fb.textContent = 'LOGO';
  schoolHeader.prepend(fb);
}

function setFallbackSchoolData() {
  const oldLogo = document.querySelector('.school-logo');
  if (oldLogo) oldLogo.remove();
  addLogoFallback();
  schoolNameDisplay.textContent = 'SCHOOL NAME';
}

function fetchSchoolData() {
  if (!API_URL || API_URL === 'PASTE_YOUR_WEB_APP_URL_HERE') {
    setFallbackSchoolData();
    setStatus('⚠️ Set API_URL inside the HTML file.', true);
    return;
  }

  const callbackName = 'gsCallback_' + Date.now();

  window[callbackName] = function(data) {
    try {
      const logoUrl    = (data.logoUrl || '').trim();
      const schoolName = (data.schoolName || 'SCHOOL NAME').trim().toUpperCase();

      schoolNameDisplay.textContent = schoolName;

      const oldLogo = document.querySelector('.school-logo');
      if (oldLogo) oldLogo.remove();
      const oldFallback = document.getElementById('logoFallback');
      if (oldFallback) oldFallback.remove();

      if (logoUrl) {
        const img = document.createElement('img');
        img.className = 'school-logo';
        img.alt = 'School Logo';
        img.src = logoUrl;
        img.onerror = function() { img.remove(); addLogoFallback(); };
        schoolHeader.prepend(img);
      } else {
        addLogoFallback();
      }

      setStatus('✅ School data loaded.', false);
    } catch (err) {
      console.error(err);
      setFallbackSchoolData();
      setStatus('⚠️ Error reading data.', true);
    } finally {
      delete window[callbackName];
      const s = document.getElementById(callbackName);
      if (s) s.remove();
    }
  };

  const script = document.createElement('script');
  script.id  = callbackName;
  script.src = API_URL + (API_URL.indexOf('?') >= 0 ? '&' : '?') + 'callback=' + callbackName;
  script.onerror = function() {
    setFallbackSchoolData();
    setStatus('❌ Could not reach Apps Script. Check API_URL.', true);
    delete window[callbackName];
  };
  document.body.appendChild(script);
}

function saveLetter() {
  const dateVal = dateInput.value || '2026-06-12';
  const dayVal  = (dayInput.value || getWeekdayFromDate(dateVal)).toUpperCase();
  const dateFormatted = formatDateOrdinal(dateVal);
  const schoolName = schoolNameDisplay.textContent;

  const letterData = {
    action: 'save',
    date: dateVal, day: dayVal, dateFormatted: dateFormatted,
    schoolName: schoolName,
    message: 'FEES DRIVE ON ' + dayVal + ', ' + dateFormatted,
    timestamp: new Date().toISOString()
  };

  console.log('💾 Letter saved (local):', letterData);

  if (API_URL && API_URL !== 'PASTE_YOUR_WEB_APP_URL_HERE') {
    fetch(API_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(letterData)
    }).catch(function(err) { console.warn('Save to sheet failed:', err); });
  }

  setStatus('✅ Letter saved — ' + dayVal + ', ' + dateFormatted, false);
}

function printLetter() { window.print(); }

function init() {
  if (!dateInput.value) dateInput.value = '2026-06-12';
  dayInput.value = getWeekdayFromDate(dateInput.value);
  updateLetterContent();

  dateInput.addEventListener('change', function() {
    dayInput.value = getWeekdayFromDate(dateInput.value);
    updateLetterContent();
  });
  dayInput.addEventListener('input', updateLetterContent);

  saveBtn.addEventListener('click', saveLetter);
  printBtn.addEventListener('click', printLetter);

  fetchSchoolData();
}

window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
